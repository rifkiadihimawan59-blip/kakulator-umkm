<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Keuangan UKM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans min-h-screen py-10">

    <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-md border border-slate-200">
        <div class="flex items-center space-x-3 mb-6 pb-4 border-b border-slate-100">
            <div class="w-10 h-10 bg-emerald-600 text-white rounded-lg flex items-center justify-center text-xl">
                <i class="fa-solid fa-calculator"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-800">Kalkulator UKM</h1>
                <p class="text-xs text-slate-500">Hitung HPP dan rekomendasi harga jual produk</p>
            </div>
        </div>

        <form id="calcForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Total Biaya Bahan (Rp)</label>
                <input type="number" id="modal" required placeholder="Contoh: 150000" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Biaya Operasional/Lain-lain (Rp)</label>
                <input type="number" id="operasional" required placeholder="Contoh: 30000" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Jumlah Produk Dihasilkan (Unit)</label>
                <input type="number" id="jumlah" required placeholder="Contoh: 20" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Target Margin Keuntungan (%)</label>
                <input type="number" id="margin" required placeholder="Contoh: 20" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
            </div>

            <button type="button" onclick="hitungKeuntungan()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition text-sm">Hitung Hasil</button>
        </form>

        <div id="hasil" class="hidden mt-6 p-4 bg-emerald-50 border border-emerald-200 rounded-xl">
            <h2 class="font-bold text-emerald-900 text-sm mb-2">Ringkasan Kalkulasi:</h2>
            <div class="text-sm space-y-1 text-slate-700">
                <p>Total Modal: <span id="resTotal" class="font-semibold"></span></p>
                <p>HPP per Unit: <span id="resHPP" class="font-semibold"></span></p>
                <p class="text-emerald-700 font-bold text-base mt-2">Harga Jual Minimal / Unit: <span id="resHargaJual"></span></p>
            </div>
        </div>
    </div>
       <form id="calcForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Total Biaya Bahan (Rp)</label>
                <input type="number" id="modal" required placeholder="Contoh: 150000" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Biaya Operasional (Rp)</label>
                <input type="number" id="operasional" required placeholder="Contoh: 30000" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Jumlah Produk Dihasilkan (Unit)</label>
                <input type="number" id="jumlah" required placeholder="Contoh: 20" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Target Margin Keuntungan (%)</label>
                <input type="number" id="margin" required placeholder="Contoh: 20" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
            </div>

            <button type="button" onclick="hitungKeuntungan()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition text-sm">Hitung Hasil</button>
        </form>
    <script src="script.js"></script>
</body>
</html>
